name: firmware-build

# firmware/配下(と本ワークフロー自身)の変更でのみ走る。docのみの更新でESP32
# ツールチェーン込みのビルドが毎回走るのを避けるため（docs/ci.md参照）。
on:
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  push:
    branches: [master]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 本番3系統(esp32dev/adxl355/piezo)と、実センサ無しで通しの結合試験を再現する
        # fake-sensor系(WiFi/送信あり、秘密不要)。sensortest系(WiFi/送信なしのセンサ
        # 検証専用)・provisionやprobe系(secrets_provision.h・実機計測前提)は対象外
        # （docs/ci.mdのfirmware-buildの節参照）。
        # NAMZ_ALWAYS_SPILL等の実機トグル(firmware/flags_from_env.py、
        # docs/log/2026-09-07-always-spill-env-var-toggle.md)は専用envを持たず
        # 環境変数で切り替えるので、本番3系統ぶんだけnamz_always_spillを立てた
        # 組み合わせをincludeで個別に足す（xN系統のような掛け算にしない）。
        include:
          - env: esp32dev
          - env: adxl355
          - env: piezo
          - env: fake-sensor
          - env: fake-sensor-device2-profile
          - env: esp32dev
            namz_always_spill: "1"
          - env: adxl355
            namz_always_spill: "1"
          - env: piezo
            namz_always_spill: "1"
    name: build (${{ matrix.env }}${{ matrix.namz_always_spill && '+always-spill' || '' }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # PlatformIOが展開するESP32ツールチェーン/フレームワーク一式(数百MB)をキャッシュする。
      # platformio.ini(platformバージョン・lib_deps)が変わらない限り2回目以降は
      # 再ダウンロードしない。プロジェクト側のlib_deps(ArduinoJson等)は
      # .pio/libdeps配下でここには含まれないが小さいので毎回取得しても軽い。
      - name: cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      # 手元(.venv)と揃えたバージョンでpin。
      - name: install PlatformIO
        run: pip install platformio==6.1.19

      - name: build firmware
        working-directory: firmware
        env:
          NAMZ_ALWAYS_SPILL: ${{ matrix.namz_always_spill }}
        run: pio run -e ${{ matrix.env }}
