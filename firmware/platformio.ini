; NamazuHaUrokoGaNai ファームウェア
; ESP32-D0WDQ6 (WROOM-32 系 DevKit) 想定
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; クローンボードのUSB-シリアル変換は921600だと化ける/書き込み不安定なので落とす
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    ; --- TFT_eSPI (TTGO T-Display / ST7789 135x240) ---
    ; センサはVSPI(25/26/27/33)なので、TFTはHSPIに載せてバス競合を避ける。
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DUSE_HSPI_PORT=1
build_unflags =
    -std=gnu++11
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    bodmer/TFT_eSPI @ ^2.5.43
    ; 送信基盤(Batch/Uploader/TimeSync)。周波数モニタ Electabuzz と共有する。
    ; **必ずタグで pin すること。** #master にすると、向こうのために入れた変更が
    ; こちらの次回ビルドで黙って混入し、「何も変えていないのに壊れる」ことになる。
    https://github.com/nna774/batch-uplink.git#v1.2.0

; Phase 1（センサ検証・シリアル出力のみ、WiFi/送信なし）を焼くとき用:
;   pio run -e sensortest -t upload && pio device monitor
[env:sensortest]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DNAMZ_SENSOR_TEST=1

; --- ADXL355 機（docs/adxl355.md）---
; センサだけ差し替えたビルド。CSは kPinCsAdxl355、サンプルは int32。
; device2実機はesptool flash_idで16MBフラッシュと物理確認済み
; （docs/log/2026-08-05-device2-spill-overflow.md）。esp32dev既定の4MB用パーティション
; だとspill(littlefs)が約1.4MBしか取れないので、device2専用に大きい表を当てる。
; device1(env:esp32dev)は未確認なのでbase側には適用しない。
; flash_sizeの上書きキーは board_build.flash_size ではなく board_upload.flash_size。
; 前者は espressif32 プラットフォームのビルドスクリプトが読んでおらず黙って無視される
; （実機はesp32dev既定の4MBのままイメージが作られ、パーティション表だけ16MB分の
; オフセットになるという不整合を起こし、起動直後に高速リセットループする）。
[env:adxl355]
extends = env:esp32dev
board_build.partitions = partitions_adxl355_16mb.csv
board_upload.flash_size = 16MB
build_flags =
    ${env:esp32dev.build_flags}
    -DNAMZ_SENSOR_ADXL355=1

; ADXL355 の立ち上げ確認用（WiFi/送信なし・シリアルにCSVを吐く）:
;   pio run -e adxl355-sensortest -t upload && pio device monitor
[env:adxl355-sensortest]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DNAMZ_SENSOR_ADXL355=1
    -DNAMZ_SENSOR_TEST=1
