; NamazuHaUrokoGaNai ファームウェア
; ESP32-D0WDQ6 (WROOM-32 系 DevKit) 想定
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; クローンボードのUSB-シリアル変換は921600だと化ける/書き込み不安定なので落とす
monitor_speed = 115200
upload_speed = 460800
; provision_main.cpp は専用env(下記[env:provision]等)だけがビルドする
; （main.cppと排他: 両方がsetup()/loop()を定義するため同一envに混在できない）。
build_src_filter =
    +<*>
    -<provision_main.cpp>
; ビルド時にgitの短縮hashをNAMZ_FW_VERSIONへ注入する（docs/ota.md §7）。
extra_scripts = pre:get_fw_version.py
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    ; postBatch()の各段階(TCP接続/TLS+送受信)にタイムスタンプ付きログを出す
    ; (batch-uplink v2.1.0)。device1の原因不明ハング調査用、既定でこのプロジェクト
    ; 全体(device1・device2とも)有効にしておく。Electabuzz側はこのbuild_flagsを
    ; 共有しないので影響しない。
    -DUPLINK_DEBUG_TIMING=1
    ; --- TFT_eSPI (TTGO T-Display / ST7789 135x240) ---
    ; センサはVSPI(25/26/27/33)なので、TFTはHSPIに載せてバス競合を避ける。
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DUSE_HSPI_PORT=1
build_unflags =
    -std=gnu++11
board_build.filesystem = littlefs
; device1・device2ともesptool flash_idで実チップ16MBと物理確認済み
; （device2: docs/log/2026-08-05-device2-spill-overflow.md、
;  device1: docs/log/2026-08-06-device1-16mb-confirm.md）。TTGO T-Display系
; クローンは個体差があるため確認前は既定の4MB用テーブルのままにしていたが、
; 両機とも16MBと分かったのでbase側に揃えた。
; flash_sizeの上書きキーは board_build.flash_size ではなく board_upload.flash_size。
; 前者は espressif32 プラットフォームのビルドスクリプトが読んでおらず黙って無視される
; （実機はesp32dev既定の4MBのままイメージが作られ、パーティション表だけ16MB分の
; オフセットになるという不整合を起こし、起動直後に高速リセットループする）。
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
; pull型OTA(docs/ota.md §7)のTLS検証用ルートCA。ファイルごとリンクし、
; main.cppから_binary_..._start/_endシンボルで参照する。
board_build.embed_txtfiles =
    certs/amazon_root_ca1.pem
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    bodmer/TFT_eSPI @ ^2.5.43
    ; 送信基盤(Batch/Uploader/TimeSync)。周波数モニタ Electabuzz と共有する。
    ; **必ずタグで pin すること。** #master にすると、向こうのために入れた変更が
    ; こちらの次回ビルドで黙って混入し、「何も変えていないのに壊れる」ことになる。
    https://github.com/nna774/batch-uplink.git#v2.1.0

; Phase 1（センサ検証・シリアル出力のみ、WiFi/送信なし）を焼くとき用:
;   pio run -e sensortest -t upload && pio device monitor
[env:sensortest]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DNAMZ_SENSOR_TEST=1

; --- ADXL355 機（docs/adxl355.md）---
; センサだけ差し替えたビルド。CSは kPinCsAdxl355、サンプルは int32。
; パーティション表・flash_sizeはbase([env:esp32dev])側に揃えたのでここでは上書きしない。
[env:adxl355]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DNAMZ_SENSOR_ADXL355=1

; ADXL355 の立ち上げ確認用（WiFi/送信なし・シリアルにCSVを吐く）:
;   pio run -e adxl355-sensortest -t upload && pio device monitor
[env:adxl355-sensortest]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DNAMZ_SENSOR_ADXL355=1
    -DNAMZ_SENSOR_TEST=1

; --- OTA更新（LAN内push、docs/ota.md）---
; USBを繋がず無線で焼く。ArduinoOTAはArduino coreに同梱でlib_depsは不要。
; パスワードはデバイスごとに違う（tools/provision_device.py ota-password --id N）ので
; 実行環境変数で渡す。upload_port も機体ごとに違うので --upload-port で毎回指定する。
;   NAMZ_OTA_PASSWORD="$(python ../tools/provision_device.py ota-password --id 1)" \
;     pio run -e esp32dev-ota -t upload --upload-port namazu-1.local
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_flags =
    --auth=${sysenv.NAMZ_OTA_PASSWORD}

[env:adxl355-ota]
extends = env:adxl355
upload_protocol = espota
upload_flags =
    --auth=${sysenv.NAMZ_OTA_PASSWORD}

; --- NVSプロビジョニング（docs/ota.md §7、pull型OTAの前提）---
; デバイス識別情報・秘密・エンドポイントURLをNVSへ書くだけの専用ビルド。
; main.cppとは排他（setup()/loop()の二重定義を避けるためbuild_src_filterで
; main.cppを外しprovision_main.cppだけを含める）。USBで焼いて1回実行し、
; 直後に通常のfirmware(env esp32dev等)を焼き直す。パーティション表がNVSの
; オフセットを決めるので、対象機と同じ base env(esp32dev/adxl355)から
; extendsして揃える（16MB機をesp32dev既定のprovisionで焼くとパーティション表が
; 巻き戻り、spill容量が壊れる）。
;   python tools/provision_device.py provision-h --id N
;   pio run -e provision -t upload --upload-port <USBポート>
;   pio run -e esp32dev -t upload --upload-port <USBポート>
[env:provision]
extends = env:esp32dev
build_src_filter =
    -<*>
    +<provision_main.cpp>

[env:adxl355-provision]
extends = env:adxl355
build_src_filter =
    -<*>
    +<provision_main.cpp>
