; phase0: ピエゾ実験機の動作確認用。docs/piezo.md 参照。
; 本線(firmware/)とは独立したスタンドアロンのPlatformIOプロジェクト。

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; ESP32-C3 SuperMini はUSB-シリアル変換チップを積んでおらず、ネイティブUSBを
; SerialのCDCとして使う。これが無いとSerial.print等がどこにも出力されない。
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
