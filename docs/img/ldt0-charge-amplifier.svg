  <line x1="50" y1="745" x2="1130" y2="745" stroke="black" stroke-width="2"/>
  <text x="1140" y="751" font-size="15">GND</text>

  <!-- Shared VREF -->
  <line x1="120" y1="70" x2="120" y2="105" stroke="black" stroke-width="2"/>
  <rect x="108" y="105" width="24" height="55" fill="white" stroke="black" stroke-width="2"/>
  <line x1="120" y1="160" x2="120" y2="195" stroke="black" stroke-width="2"/>
