  <path d="M520 340h80M600 327v26m13-26v26M613 340h102" fill="none" stroke="black" stroke-width="2"/>
  <text x="655" y="334" font-size="12">Cf = 22 nF</text><text x="655" y="350" font-size="11">フィルム</text>
  <line x1="680" y1="405" x2="770" y2="405" stroke="black" stroke-width="2"/><circle cx="715" cy="405" r="4" fill="black"/>
  <rect x="770" y="393" width="75" height="24" fill="white" stroke="black" stroke-width="2"/><text x="807" y="383" text-anchor="middle" font-size="13">470 Ω</text>
  <line x1="845" y1="405" x2="920" y2="405" stroke="black" stroke-width="2"/><circle cx="880" cy="405" r="4" fill="black"/>
  <path d="M880 405v45m-15 0h30m-30 12h30M880 462v18M860 480h40m-33 8h26m-19 8h12" fill="none" stroke="black" stroke-width="2"/><text x="900" y="460" font-size="12">10 nF</text>
  <rect x="920" y="377" width="150" height="56" rx="4" fill="white" stroke="black" stroke-width="2"/><text x="995" y="400" text-anchor="middle" font-size="14">ESP32-C3</text><text x="995" y="421" text-anchor="middle" font-size="14">GPIO0（X）</text>

  <!-- North-south channel -->
  <text x="50" y="610" font-size="17" font-weight="bold">南北軸</text>
  <rect x="50" y="630" width="145" height="85" rx="5" fill="white" stroke="black" stroke-width="2"/>
  <text x="122" y="662" text-anchor="middle" font-size="15">LDT0-028K</text><text x="122" y="685" text-anchor="middle" font-size="13">南北方向</text><text x="122" y="704" text-anchor="middle" font-size="11">480 pF / 80 Vpp</text>
  <line x1="195" y1="655" x2="250" y2="655" stroke="black" stroke-width="2"/><rect x="250" y="643" width="90" height="24" fill="white" stroke="black" stroke-width="2"/><text x="295" y="633" text-anchor="middle" font-size="13">220 kΩ</text>
  <line x1="340" y1="655" x2="550" y2="655" stroke="black" stroke-width="2"/><line x1="195" y1="695" x2="480" y2="695" stroke="#2457a6" stroke-width="3"/><circle cx="480" cy="695" r="4" fill="#2457a6"/>
  <polygon points="550,605 550,705 680,655" fill="white" stroke="black" stroke-width="2"/><text x="566" y="637" font-size="15">−</text><text x="566" y="685" font-size="15">+</text><text x="610" y="660" font-size="14">B</text>
  <line x1="480" y1="680" x2="550" y2="680" stroke="#2457a6" stroke-width="3"/><circle cx="480" cy="680" r="4" fill="#2457a6"/><text x="615" y="720" text-anchor="middle" font-size="13">MCP6004-B</text>
  <circle cx="520" cy="655" r="4" fill="black"/><path d="M520 655V560H550" fill="none" stroke="black" stroke-width="2"/><rect x="550" y="548" width="130" height="24" fill="white" stroke="black" stroke-width="2"/><path d="M680 560h35v95" fill="none" stroke="black" stroke-width="2"/><text x="615" y="538" text-anchor="middle" font-size="13">Rf = 10 MΩ</text>
  <path d="M520 590h80M600 577v26m13-26v26M613 590h102" fill="none" stroke="black" stroke-width="2"/><text x="655" y="584" font-size="12">Cf = 22 nF</text><text x="655" y="600" font-size="11">フィルム</text>
  <line x1="680" y1="655" x2="770" y2="655" stroke="black" stroke-width="2"/><circle cx="715" cy="655" r="4" fill="black"/><rect x="770" y="643" width="75" height="24" fill="white" stroke="black" stroke-width="2"/><text x="807" y="633" text-anchor="middle" font-size="13">470 Ω</text>
  <line x1="845" y1="655" x2="920" y2="655" stroke="black" stroke-width="2"/><circle cx="880" cy="655" r="4" fill="black"/><path d="M880 655v40m-15 0h30m-30 12h30M880 707v10M860 717h40m-33 8h26m-19 8h12" fill="none" stroke="black" stroke-width="2"/><text x="900" y="705" font-size="12">10 nF</text>
  <rect x="920" y="627" width="150" height="56" rx="4" fill="white" stroke="black" stroke-width="2"/><text x="995" y="650" text-anchor="middle" font-size="14">ESP32-C3</text><text x="995" y="671" text-anchor="middle" font-size="14">GPIO1（Y）</text>

  <text x="600" y="778" text-anchor="middle" font-size="13" fill="#444">各軸 fc ≈ 0.72 Hz、80 Vpp 時の出力 ≈ 1.65 V ± 0.87 V。入力クランプと非通電時保護は別途設計する。</text>
