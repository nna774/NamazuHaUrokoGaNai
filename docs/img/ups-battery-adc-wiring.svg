<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="white"/>

  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="black">
    UPSバッテリー電圧分圧回路（LFUPSMA B+/B- → GPIO39, R1=R2=10kΩ, Rs=1kΩ, C1=0.1µF）
  </text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#555">
    未実装・設計案（2026-09-28改訂。ソースインピーダンス低減+ADC入力保護のレビュー指摘を反映）
  </text>

  <!-- LFUPSMA module -->
  <rect x="50" y="130" width="150" height="130" rx="6" fill="none" stroke="black" stroke-width="2"/>
  <text x="125" y="180" text-anchor="middle" font-size="15" fill="black">LFUPSMA</text>
  <text x="125" y="198" text-anchor="middle" font-size="11" fill="#555">(UPS充放電</text>
  <text x="125" y="213" text-anchor="middle" font-size="11" fill="#555">モジュール)</text>

  <!-- B+ pad -->
  <circle cx="200" cy="160" r="5" fill="#c0392b"/>
  <text x="205" y="155" font-size="13" fill="#c0392b">B+</text>
  <!-- B- pad -->
  <circle cx="200" cy="230" r="5" fill="black"/>
  <text x="205" y="248" font-size="13" fill="black">B-</text>

  <!-- rails -->
  <line x1="200" y1="160" x2="280" y2="160" stroke="#c0392b" stroke-width="2"/>
  <line x1="280" y1="60" x2="280" y2="160" stroke="#c0392b" stroke-width="2"/>
  <line x1="280" y1="60" x2="820" y2="60" stroke="#c0392b" stroke-width="2"/>
  <text x="830" y="65" font-size="14" fill="#c0392b">B+（セル電圧、満充電時 約3.6〜3.65V）</text>

  <line x1="200" y1="230" x2="230" y2="230" stroke="black" stroke-width="2"/>
  <line x1="230" y1="230" x2="230" y2="500" stroke="black" stroke-width="2"/>
  <line x1="230" y1="500" x2="820" y2="500" stroke="black" stroke-width="2"/>
  <text x="830" y="505" font-size="14" fill="black">GND（B-とESP32 GND共通）</text>

  <!-- divider stack at x=400 -->
  <!-- top rail -> R1 -->
  <line x1="400" y1="60" x2="400" y2="110" stroke="black" stroke-width="2"/>
  <rect x="388" y="110" width="24" height="90" fill="none" stroke="black" stroke-width="2"/>
  <text x="422" y="145" font-size="14" fill="black">R1</text>
  <text x="422" y="163" font-size="14" fill="black">10kΩ</text>

  <!-- R1 -> Node A (分圧中点) -->
  <line x1="400" y1="200" x2="400" y2="230" stroke="black" stroke-width="2"/>
  <circle cx="400" cy="230" r="4" fill="black"/>
  <text x="400" y="215" text-anchor="middle" font-size="11" fill="#555">Node A(分圧中点)</text>

  <!-- Node A -> R2 -> GND rail -->
  <line x1="400" y1="230" x2="400" y2="260" stroke="black" stroke-width="2"/>
  <rect x="388" y="260" width="24" height="90" fill="none" stroke="black" stroke-width="2"/>
  <text x="422" y="295" font-size="14" fill="black">R2</text>
  <text x="422" y="313" font-size="14" fill="black">10kΩ</text>
  <line x1="400" y1="350" x2="400" y2="500" stroke="black" stroke-width="2"/>

  <!-- Node A -> Rs (直列保護抵抗) -> Node B -->
  <line x1="400" y1="230" x2="560" y2="230" stroke="black" stroke-width="2"/>
  <rect x="560" y="218" width="70" height="24" fill="none" stroke="black" stroke-width="2"/>
  <text x="595" y="205" text-anchor="middle" font-size="14" fill="black">Rs 1kΩ</text>
  <text x="595" y="255" text-anchor="middle" font-size="10" fill="#555">(ADC入力保護・兼RCフィルタの直列脚)</text>
  <line x1="630" y1="230" x2="700" y2="230" stroke="#1e8449" stroke-width="3"/>
  <circle cx="700" cy="230" r="4" fill="#1e8449"/>
  <text x="700" y="215" text-anchor="middle" font-size="11" fill="#1e8449">Node B(ADC入力点)</text>

  <!-- C1 at Node B (直前、ピン側) -->
  <line x1="700" y1="230" x2="700" y2="300" stroke="black" stroke-width="2"/>
  <line x1="675" y1="300" x2="725" y2="300" stroke="black" stroke-width="3"/>
  <line x1="675" y1="312" x2="725" y2="312" stroke="black" stroke-width="3"/>
  <line x1="700" y1="312" x2="700" y2="500" stroke="black" stroke-width="2"/>
  <text x="735" y="310" font-size="14" fill="black">C1 0.1µF</text>
  <text x="735" y="327" font-size="11" fill="#555">(ADCピン直前でRs×C1のRCフィルタ)</text>

  <!-- Node B -> GPIO39 -->
  <line x1="700" y1="230" x2="700" y2="180" stroke="#1e8449" stroke-width="3"/>
  <rect x="625" y="130" width="150" height="50" fill="none" stroke="#1e8449" stroke-width="2"/>
  <text x="700" y="153" text-anchor="middle" font-size="14" fill="#1e8449" font-weight="bold">GPIO39</text>
  <text x="700" y="170" text-anchor="middle" font-size="11" fill="#1e8449">(ADC1_CH3, ESP32)</text>

  <!-- ESP32 GND -->
  <line x1="700" y1="130" x2="700" y2="90" stroke="black" stroke-width="2"/>
  <line x1="700" y1="90" x2="780" y2="90" stroke="black" stroke-width="2"/>
  <text x="785" y="93" font-size="11" fill="#555">※実配線ではESP32のGNDピンへ別途配線(図は模式)</text>

  <!-- legend / notes -->
  <text x="60" y="400" font-size="12" fill="#555">
    ・R1=R2を100kΩ→10kΩへ変更: ADCが見るソースインピーダンスをR1‖R2+Rs=5kΩ+1kΩ=6kΩまで下げ、ESP32 ADCの推奨上限(概ね10kΩ以下)に収めた。
  </text>
  <text x="60" y="418" font-size="12" fill="#555">
    ・Rs(1kΩ)を追加: LFUPSMA側の未知の異常出力に対するADCピンの過電流保護。DC定常状態ではCに電流が流れずRsに電流も流れないため、分圧比(2:1)は変わらない。
  </text>
  <text x="60" y="436" font-size="12" fill="#555">
    ・C1をADCピン直前(Node B)へ移動: Rs×C1=100µsのRC時定数がADC内蔵サンプルホールドキャパシタより十分大きく、直前で電圧を安定させてから読ませる形になる。
  </text>
  <text x="60" y="454" font-size="12" fill="#555">
    ・常時分圧のまま(有効/無効切替なし): 漏れ電流は3.65V/20kΩ≒183µA、1800mAhセルおよびESP32本体の消費電流(数十〜数百mA)に対し無視できる。
  </text>
  <text x="450" y="530" text-anchor="middle" font-size="11" fill="#c0392b">
    未検証: 実機での分圧比較正（テスターとADC読みの突き合わせ）が要る。analogReadMilliVolts()でeFuse較正込みの値を使うが個体差の残差は残る。docs/ups.md §4/§5参照。
  </text>
</svg>
