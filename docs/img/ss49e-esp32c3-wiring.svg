<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="white"/>

  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="black">
    SS49E ⇄ ESP32-C3 SuperMini(HW-466AB) 配線図
  </text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#555">
    実機の写真(2026-08-27)でシルク印字を確認した、この個体の実物ピン配置
  </text>

  <!-- board -->
  <rect x="200" y="150" width="500" height="140" rx="6" fill="#222" stroke="black" stroke-width="2"/>
  <text x="450" y="215" text-anchor="middle" font-size="16" fill="white">ESP32-C3</text>
  <text x="450" y="235" text-anchor="middle" font-size="16" fill="white">SuperMini</text>
  <text x="450" y="255" text-anchor="middle" font-size="11" fill="#aaa">(HW-466AB)</text>

  <!-- USB-C connector -->
  <rect x="165" y="195" width="35" height="50" fill="#999" stroke="black" stroke-width="2"/>
  <text x="182" y="270" text-anchor="middle" font-size="11" fill="black">USB-C</text>

  <!-- top row pins: 5,6,7,8,9,10,20,21 -->
  <!-- x positions -->
  <!-- i=0..7 -> x=240,300,360,420,480,540,600,660 -->

  <!-- pin stubs top -->
  <g stroke="black" stroke-width="2">
    <line x1="240" y1="150" x2="240" y2="138"/>
    <line x1="300" y1="150" x2="300" y2="138"/>
    <line x1="360" y1="150" x2="360" y2="138"/>
    <line x1="420" y1="150" x2="420" y2="138"/>
    <line x1="480" y1="150" x2="480" y2="138"/>
    <line x1="540" y1="150" x2="540" y2="138"/>
    <line x1="600" y1="150" x2="600" y2="138"/>
    <line x1="660" y1="150" x2="660" y2="138"/>
  </g>

  <!-- GPIO9 warning highlight (top row, index4, x=480) -->
  <rect x="466" y="120" width="28" height="24" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- top labels -->
  <g font-size="14" text-anchor="middle" fill="black">
    <text x="240" y="132">5</text>
    <text x="300" y="132">6</text>
    <text x="360" y="132">7</text>
    <text x="420" y="132">8</text>
    <text x="480" y="132" fill="#c0392b" font-weight="bold">9</text>
    <text x="540" y="132">10</text>
    <text x="600" y="132">20</text>
    <text x="660" y="132">21</text>
  </g>
  <text x="480" y="105" text-anchor="middle" font-size="11" fill="#c0392b">✕ BOOTボタン専有・触るな</text>
  <text x="600" y="105" text-anchor="middle" font-size="10" fill="#777">(RX)</text>
  <text x="660" y="105" text-anchor="middle" font-size="10" fill="#777">(TX)</text>

  <!-- bottom row pins: 5V,GND,3.3,4,3,2,1,0 -->
  <g stroke="black" stroke-width="2">
    <line x1="240" y1="290" x2="240" y2="302"/>
    <line x1="300" y1="290" x2="300" y2="302"/>
    <line x1="360" y1="290" x2="360" y2="302"/>
    <line x1="420" y1="290" x2="420" y2="302"/>
    <line x1="480" y1="290" x2="480" y2="302"/>
    <line x1="540" y1="290" x2="540" y2="302"/>
    <line x1="600" y1="290" x2="600" y2="302"/>
    <line x1="660" y1="290" x2="660" y2="302"/>
  </g>

  <!-- GND highlight (i1, x300) -->
  <rect x="286" y="300" width="28" height="24" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <!-- 3.3V highlight (i2, x360) -->
  <rect x="346" y="300" width="28" height="24" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <!-- GPIO3 highlight (i4, x480) -->
  <rect x="466" y="300" width="28" height="24" fill="#fef5e7" stroke="#e67e22" stroke-width="2"/>
  <!-- GPIO2 warning (i5, x540) -->
  <rect x="526" y="300" width="28" height="24" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- bottom labels -->
  <g font-size="14" text-anchor="middle" fill="black">
    <text x="240" y="345">5V</text>
    <text x="300" y="345" fill="#1e8449" font-weight="bold">GND</text>
    <text x="360" y="345" fill="#1e8449" font-weight="bold">3.3V</text>
    <text x="420" y="345">4</text>
    <text x="480" y="345" fill="#e67e22" font-weight="bold">3</text>
    <text x="540" y="345" fill="#c0392b" font-weight="bold">2</text>
    <text x="600" y="345">1</text>
    <text x="660" y="345">0</text>
  </g>
  <text x="540" y="365" text-anchor="middle" font-size="11" fill="#c0392b">✕ ストラップピン・触るな</text>

  <!-- wires from SS49E module up to board pins -->
  <!-- SS49E module -->
  <rect x="360" y="470" width="180" height="80" rx="6" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="500" text-anchor="middle" font-size="15" fill="black">SS49E</text>
  <text x="450" y="520" text-anchor="middle" font-size="12" fill="#555">(アナログホールセンサ)</text>
  <text x="450" y="538" text-anchor="middle" font-size="10" fill="#777">VCC/GND/OUTの並びは</text>
  <text x="450" y="552" text-anchor="middle" font-size="10" fill="#777">実物モジュールの印字で確認すること</text>

  <!-- module pins (generic, order unknown - placed evenly, connect by function not position) -->
  <circle cx="400" cy="470" r="5" fill="#1e8449"/>
  <circle cx="450" cy="470" r="5" fill="#e67e22"/>
  <circle cx="500" cy="470" r="5" fill="black"/>
  <text x="400" y="462" text-anchor="middle" font-size="11" fill="#1e8449">VCC</text>
  <text x="450" y="462" text-anchor="middle" font-size="11" fill="#e67e22">OUT</text>
  <text x="500" y="462" text-anchor="middle" font-size="11" fill="black">GND</text>

  <!-- VCC -> 3.3V(x360,y324) -->
  <path d="M 400 470 C 400 400, 360 380, 360 324" fill="none" stroke="#1e8449" stroke-width="3"/>
  <!-- OUT -> GPIO3(x480,y324) -->
  <path d="M 450 470 C 450 400, 480 380, 480 324" fill="none" stroke="#e67e22" stroke-width="3"/>
  <!-- GND -> GND(x300,y324) -->
  <path d="M 500 470 C 560 420, 300 380, 300 324" fill="none" stroke="black" stroke-width="3"/>

  <!-- legend -->
  <g font-size="12" fill="black">
    <rect x="60" y="580" width="14" height="14" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
    <text x="80" y="591">電源(GND/3.3V)</text>
    <rect x="230" y="580" width="14" height="14" fill="#fef5e7" stroke="#e67e22" stroke-width="2"/>
    <text x="250" y="591">信号(OUT→GPIO3)</text>
    <rect x="420" y="580" width="14" height="14" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="440" y="591">触ってはいけないピン(GPIO2=ストラップ, GPIO9=BOOT)</text>
  </g>
  <text x="450" y="610" text-anchor="middle" font-size="11" fill="#555">
    docs/piezo.md のピエゾ機とは印字の並び順が異なる別個体。GPIO番号自体の機能(ADC1範囲・ストラップ・BOOT)はチップ仕様なので基板差の影響を受けない。
  </text>
</svg>
